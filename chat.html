<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دستیار ژرف | هوش مصنوعی فارسی</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f1f5f9; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* تبلیغات منعطف */
    .ads-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 5px; background: #020617; }
    @media (max-width: 600px) { .ads-bar { grid-template-columns: repeat(2, 1fr); } }
    .ad-card { background: var(--panel); padding: 5px; border-radius: 4px; text-decoration: none; color: #94a3b8; font-size: 0.7rem; border: 1px solid var(--border); }

    /* چیدمان اصلی */
    .chat-wrapper { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; height: 100%; }
    .msg-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    /* پیام‌ها */
    .msg { padding: 12px; border-radius: 10px; max-width: 90%; line-height: 1.5; font-size: 0.95rem; }
    .msg-user { align-self: flex-end; background: var(--accent); color: white; }
    .msg-bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }

    /* ورودی */
    .input-area { padding: 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
    textarea { flex: 1; background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; resize: none; height: 50px; outline: none; }
    .btn-send { background: #10b981; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="ads-bar" id="ads-container"></div>
  <div class="chat-wrapper">
    <div class="msg-area" id="messages-box">
       <div class="msg msg-bot">سلام! ژرف هستم، چطور کمکتان کنم؟</div>
    </div>
    <div class="input-area">
      <textarea id="user-input" placeholder="پرسش خود را بنویسید..."></textarea>
      <button class="btn-send" id="btn-send">ارسال</button>
    </div>
  </div>

  <script src="/ads.js"></script>
  <script>
    // آدرس مستقیم برای عبور از فیلترینگ و خطاهای آروان
    const API_URL = 'https://zherf-proxy.esmailriahi110.workers.dev';
    
    const sendBtn = document.getElementById('btn-send');
    const input = document.getElementById('user-input');
    const msgBox = document.getElementById('messages-box');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // نمایش پیام کاربر
      const uDiv = document.createElement('div');
      uDiv.className = 'msg msg-user';
      uDiv.textContent = text;
      msgBox.appendChild(uDiv);
      input.value = '';
      
      // نمایش لودینگ
      const bDiv = document.createElement('div');
      bDiv.className = 'msg msg-bot';
      bDiv.textContent = '...';
      msgBox.appendChild(bDiv);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
        });
        const data = await res.json();
        bDiv.textContent = data.choices[0].message.content;
      } catch (e) {
        bDiv.textContent = 'خطای اتصال. لطفا مجدد تلاش کنید.';
      }
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    renderZherfAds(); // فراخوانی تابع تبلیغات
  </script>
</body>
</html>
