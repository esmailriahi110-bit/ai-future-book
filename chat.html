<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ژرف AI | دستیار هوشمند و چت‌بات فارسی</title>
    <meta name="description" content="چت رایگان، سریع و بدون فیلتر با هوش مصنوعی ژرف. پاسخ به تمام پرسش‌های علمی، تخصصی، سرگرمی و پژوهشی.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --chat-bg: #0b1120;
            --neon-green: #10b981;
            --neon-glow: rgba(16, 185, 129, 0.3);
            --neon-orange: #f97316;
            --neon-orange-glow: rgba(249, 115, 22, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --user-msg-bg: #1e293b;
            --ai-msg-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* سایدبار تاریخچه */
        .sidebar {
            width: 290px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-new-chat {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
        }

        .btn-new-chat:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .history-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            padding-left: 6px;
        }

        .history-item:hover, .history-item.active {
            background: rgba(16, 185, 129, 0.12);
            color: var(--neon-green);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .btn-delete-session {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            padding: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .btn-delete-session:hover {
            color: #ef4444;
            opacity: 1;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-clear-history {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.6);
            color: #ef4444;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear-history:hover {
            background: #ef4444;
            color: #fff;
        }

        /* بخش اصلی چت */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--chat-bg);
            position: relative;
        }

        /* هدر و کارت‌های تبلیغاتی با حاشیه نارنجی مدرن دیجیتالی */
        .chat-header {
            padding: 10px 15px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-top-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .brand-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* استایل تبلیغات با نئون نارنجی دیجیتالی مدرن */
        .ad-card {
            background: rgba(249, 115, 22, 0.04);
            border: 1px solid var(--neon-orange);
            box-shadow: 0 0 6px var(--neon-orange-glow);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            text-decoration: none;
            color: #ffedd5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.25s ease;
        }

        .ad-card:hover {
            background: rgba(249, 115, 22, 0.15);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .ad-card i {
            font-size: 14px;
            color: var(--neon-orange);
        }

        /* پنجره پیام‌ها */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            position: relative;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-end;
            background: var(--ai-msg-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-bottom-left-radius: 2px;
        }

        .message-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-copy {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
        }

        .btn-copy:hover {
            color: var(--neon-green);
        }

        /* کادر ورود پیام جادار با دکمه ارسال اختصاصی رو به آسمان */
        .chat-input-area {
            padding: 14px 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            gap: 4px;
            line-height: 1.7;
            position: relative;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-end;
            background: var(--ai-msg-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-bottom-left-radius: 2px;
        }

        .message-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-copy {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
        }

        .btn-copy:hover {
            color: var(--neon-green);
        }

        /* کادر ورود پیام جادار با دکمه ارسال اختصاصی رو به آسمان */
        .chat-input-area {
            padding: 14px 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color                right: 0;
                height: 100%;
                box-shadow: -5px 0 20px rgba(0,0,0,0.6);
                transform: translateX(100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .toggle-sidebar-btn, .close-sidebar-btn {
                display: block;
            }

            .ads-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- سایدبار گفتگوهای ذخیره‌شده -->
    <aside class="sidebar" id="chatSidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" id="btnNewChat">
                <i class="fa fa-plus"></i> گفتگوی جدید
            </button>
            <button class="close-sidebar-btn" id="btnCloseSidebar">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div class="chat-history-list" id="chatHistoryList">
            <!-- لیست چت‌ها با دکمه حذف تکی -->
        </div>
        <div class="sidebar-footer">
            <button class="btn-clear-history" id="btnClearHistory">
                <i class="fa fa-trash"></i> پاکسازی کل تاریخچه
            </button>
        </div>
    </aside>

    <!-- بخش اصلی چت -->
    <main class="main-chat">
        <header class="chat-header">
            <div class="header-top">
                <div class="header-top-right">
                    <button class="toggle-sidebar-btn" id="btnOpenSidebar">
                        <i class="fa fa-bars"></i>
                    </button>
                    <div class="brand-title">
                        <i class="fa fa-brain"></i> ژرف AI
                    </div>
                </div>
                <div>
                    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 12px;">
                        <i class="fa fa-home"></i> صفحه اصلی
                    </a>
                </div>
            </div>

            <!-- ۴ باکس تبلیغاتی با طراحی نارنجی نئونی -->
            <div class="ads-grid">
                <!-- ۱. لینک پورسانتی اختصاصی میهن وب هاست -->
                <a href="https://mihanwebhost.com/my/referrers_confirm.php?code=mwh-8b7c8" target="_blank" rel="noopener noreferrer" class="ad-card">
                    <i class="fa fa-server"></i>
                    <span>هاست و سرور ابری</span>
                </a>

                <!-- ۲. لینک طاقچه کتاب هوش مصنوعی -->
                <a href="https://taaghche.com/book/296988/AI%D8%9B-%D9%86%D9%82%D8%B4%D9%87-%D8%A7%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%A2%DB%8C%D9%86%D8%AF%D9%87" target="_blank" rel="noopener noreferrer" class="ad-card">
                    <i class="fa fa-book-open"></i>
                    <span>کتاب نقشه‌ای برای آینده</span>
                </a>

                <!-- ۳. جایگاه خالی تبلیغات ۱ -->
                <a href="contact.html" class="ad-card">
                    <i class="fa fa-bullhorn"></i>
                    <span>محل تبلیغ شما</span>
                </a>

                <!-- ۴. جایگاه خالی تبلیغات ۲ -->
                <a href="contact.html" class="ad-card">
                    <i class="fa fa-ad"></i>
                    <span>سفارش تبلیغات</span>
                </a>
            </div>
        </header>

        <!-- محل نمایش پیام‌ها -->
        <div class="messages-container" id="messagesContainer">
            <div class="message assistant">
                سلام! من دستیار هوشمند ژرف AI هستم. چطور می‌توانم کمکتان کنم؟
            </div>
        </div>

        <!-- ورودی کاربر و دکمه فلش رو به آسمان -->
        <footer class="chat-input-area">
            <div class="input-wrapper">
                <textarea class="chat-textarea" id="userInput" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
            </div>
            <button class="btn-send-standalone" id="btnSend" title="ارسال پیام">
                <i class="fa fa-arrow-up"></i>
            </button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
