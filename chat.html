<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ژرف AI | محیط گفتگو</title>
    <!-- استایل‌ها و فونت Vazirmatn برای زیبایی کاربری -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-main: #18191c;
            --bg-sidebar: #121316;
            --bg-card: #202227;
            --bg-input: #23252a;
            --border-color: #2e3138;
            --text-primary: #f0f1f5;
            --text-muted: #8e93a0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --user-bubble: #272a31;
            --bot-bubble: #1e2025;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- سایدبار / نوار کشویی --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .new-chat-btn:hover {
            background: #2a2d34;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .history-item:hover, .history-item.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- محتوای اصلی چت --- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: var(--bg-main);
        }

        .chat-header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(24, 25, 28, 0.85);
            backdrop-filter: blur(8px);
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            display: none; /* روی دسکتاپ مخفی است */
        }

        /* فضای نمایش پیام‌ها */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.25s ease;
        }

        .message.bot {
            align-self: flex-start;
        }
        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .message.bot .bubble {
            background-color: var(--bot-bubble);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 4px;
        }

        .message.user .bubble {
            background-color: var(--accent-color);
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        /* کارت‌های راهنما/سفارشی */
        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }

        .promo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .promo-card:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* --- نوار ورودی پایین صفحه --- */
        .chat-input-area {
            padding: 12px 16px 16px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-main) 30%);
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s;
        }
        .input-box:focus-within {
            border-color: var(--accent-color);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            max-height: 140px;
            min-height: 24px;
            line-height: 1.5;
            padding: 4px 0;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .action-btn:hover {
            color: var(--text-primary);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #fff;
        }
        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        /* ماسک برای بستن منو در موبایل */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
        }

        /* ریسپانسیو موبایل */
        @media (max-width: 768px) {
            .menu-toggle-btn {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                transform: translateX(100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .message {
                max-width: 90%;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- سایدبار مشابه GapGPT -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <span>➕ گفتگو جدید</span>
            </button>
        </div>
        <div class="history-list">
            <div class="history-item active">گفتگوی جاری</div>
            <div class="history-item">بررسی سرور و هاست پایتون</div>
            <div class="history-item">تنظیمات پایگاه داده</div>
        </div>
        <div class="sidebar-footer">
            <span>👤 کاربر مهمان / حساب کاربری</span>
        </div>
    </aside>

    <!-- پنل اصلی چت -->
    <main class="main-chat">
        <header class="chat-header">
            <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
            <div class="header-title">ژرف AI</div>
            <div style="width: 24px;"></div>
        </header>

        <section class="chat-messages" id="chatArea">
            <!-- کارت‌های بالایی -->
            <div class="promo-grid">
                <div class="promo-card">کتاب AI: نقشه آینده</div>
                <div class="promo-card">تخفیف هاست پایتون</div>
                <div class="promo-card">پذیرش آگهی هوشمند</div>
            </div>

            <div class="message bot">
                <div class="bubble">
                    سلام! چطور می‌توانم کمکتان کنم؟
                </div>
            </div>
        </section>

        <!-- کادر ورودی پیام -->
        <footer class="chat-input-area">
            <div class="input-box">
                <button class="action-btn" title="افزودن فایل">📎</button>
                <textarea id="promptInput" rows="1" placeholder="پیام خود را بنویسید..." oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
                <button class="action-btn send-btn" onclick="sendMessage()" title="ارسال">➤</button>
            </div>
        </footer>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const chatArea = document.getElementById('chatArea');
    const promptInput = document.getElementById('promptInput');

    function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function checkEnter(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function sendMessage() {
        const text = promptInput.value.trim();
        if (!text) return;

        // پیام کاربر
        const userMsg = document.createElement('div');
        userMsg.className = 'message user';
        userMsg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatArea.appendChild(userMsg);

        promptInput.value = '';
        promptInput.style.height = 'auto';
        chatArea.scrollTop = chatArea.scrollHeight;

        // پاسخ نمونه هوش مصنوعی
        setTimeout(() => {
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerHTML = `<div class="bubble">پیام شما دریافت شد. در حال پردازش اطلاعات...</div>`;
            chatArea.appendChild(botMsg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 600);
    }

    function startNewChat() {
        chatArea.innerHTML = `
            <div class="promo-grid">
                <div class="promo-card">کتاب AI: نقشه آینده</div>
                <div class="promo-card">تخفیف هاست پایتون</div>
            </div>
            <div class="message bot">
                <div class="bubble">سلام! یک گفتگوی جدید آغاز شد. چطور می‌توانم کمکتان کنم؟</div>
            </div>`;
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
