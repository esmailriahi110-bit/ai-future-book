<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ژرف AI | دستیار هوشمند و چت‌بات فارسی</title>
    <meta name="description" content="چت رایگان، سریع و بدون فیلتر با هوش مصنوعی ژرف. پاسخ به تمام پرسش‌های علمی، تخصصی، سرگرمی و پژوهشی.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --chat-bg: #0b1120;
            --neon-green: #10b981;
            --neon-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --user-msg-bg: #1e293b;
            --ai-msg-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* سایدبار تاریخچه */
        .sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-new-chat {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: 0.2s;
            width: 100%;
            justify-content: center;
        }

        .btn-new-chat:hover {
            background: var(--neon-green);
            color: #000;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover, .history-item.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--neon-green);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-clear-history {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* بخش اصلی چت */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--chat-bg);
            position: relative;
        }

        /* هدر چت و ۴ باکس تبلیغاتی استاندارد */
        .chat-header {
            padding: 10px 15px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-top-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .brand-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .ad-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 8px 6px;
            text-align: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }

        .ad-card:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(16, 185, 129, 0.08);
        }

        .ad-card.featured-mwh {
            border: 1px solid var(--neon-green);
            color: #a7f3d0;
            background: rgba(16, 185, 129, 0.12);
        }

        .ad-card.featured-book {
            border: 1px solid #38bdf8;
            color: #bae6fd;
            background: rgba(56, 189, 248, 0.12);
        }

        /* پنجره پیام‌ها */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            position: relative;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-end;
            background: var(--ai-msg-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-bottom-left-radius: 2px;
        }

        .message-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-copy {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
        }

        .btn-copy:hover {
            color: var(--neon-green);
        }

        /* کادر ارسال پیام */
        .chat-input-area {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 10px;
            gap: 8px;
        }

        .input-wrapper:focus-within {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-glow);
        }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 6px 0;
            line-height: 1.5;
        }

        .input-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .input-btn:hover {
            color: var(--neon-green);
        }

        .btn-send {
            color: var(--neon-green);
            font-size: 18px;
        }

        /* رسپانسیو */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                right: 0;
                height: 100%;
                box-shadow: -5px 0 20px rgba(0,0,0,0.5);
                transform: translateX(100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .toggle-sidebar-btn, .close-sidebar-btn {
                display: block;
            }

            .ads-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- سایدبار گفتگوهای ذخیره‌شده -->
    <aside class="sidebar" id="chatSidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" id="btnNewChat">
                <i class="fa fa-plus"></i> گفتگوی جدید
            </button>
            <button class="close-sidebar-btn" id="btnCloseSidebar">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div class="chat-history-list" id="chatHistoryList">
            <!-- آیتم‌ها توسط JS بارگذاری می‌شوند -->
        </div>
        <div class="sidebar-footer">
            <button class="btn-clear-history" id="btnClearHistory">
                <i class="fa fa-trash"></i> پاکسازی تاریخچه
            </button>
        </div>
    </aside>

    <!-- بخش اصلی چت -->
    <main class="main-chat">
        <header class="chat-header">
            <div class="header-top">
                <div class="header-top-right">
                    <button class="toggle-sidebar-btn" id="btnOpenSidebar">
                        <i class="fa fa-bars"></i>
                    </button>
                    <div class="brand-title">
                        <i class="fa fa-brain"></i> ژرف AI
                    </div>
                </div>
                <div>
                    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 12px;">
                        <i class="fa fa-home"></i> صفحه اصلی
                    </a>
                </div>
            </div>

            <!-- ۴ باکس تبلیغاتی -->
            <div class="ads-grid">
                <!-- ۱. لینک پورسانتی اختصاصی میهن وب هاست -->
                <a href="https://mihanwebhost.com/my/referrers_confirm.php?code=mwh-8b7c8" target="_blank" rel="noopener noreferrer" class="ad-card featured-mwh">
                    <i class="fa fa-server"></i>
                    <span>هاست و سرور ابری</span>
                </a>

                <!-- ۲. لینک طاقچه کتاب هوش مصنوعی -->
                <a href="https://taaghche.com/book/296988/AI%D8%9B-%D9%86%D9%82%D8%B4%D9%87-%D8%A7%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%A2%DB%8C%D9%86%D8%AF%D9%87" target="_blank" rel="noopener noreferrer" class="ad-card featured-book">
                    <i class="fa fa-book-open"></i>
                    <span>کتاب نقشه‌ای برای آینده</span>
                </a>

                <!-- ۳. جایگاه خالی تبلیغات ۱ -->
                <a href="contact.html" class="ad-card">
                    <i class="fa fa-bullhorn"></i>
                    <span>محل تبلیغ شما</span>
                </a>

                <!-- ۴. جایگاه خالی تبلیغات ۲ -->
                <a href="contact.html" class="ad-card">
                    <i class="fa fa-ad"></i>
                    <span>سفارش تبلیغات</span>
                </a>
            </div>
        </header>

        <!-- محل نمایش پیام‌ها -->
        <div class="messages-container" id="messagesContainer">
            <div class="message assistant">
                سلام! من دستیار هوشمند ژرف AI هستم. چطور می‌توانم کمکتان کنم؟
            </div>
        </div>

        <!-- ورودی کاربر -->
        <footer class="chat-input-area">
            <div class="input-wrapper">
                <textarea class="chat-textarea" id="userInput" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
                <button class="input-btn btn-send" id="btnSend" title="ارسال پیام">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
