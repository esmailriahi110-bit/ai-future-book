<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دستیار هوشمند ژرف | AI چت تخصصی</title>
  <meta name="description" content="گفتگو با دستیار هوشمند ژرف - چت رایگان، سریع و پیشرفته هوش مصنوعی به زبان فارسی">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-dark: #0f172a;
      --panel-border: #1e293b;
      --accent-orange: #f97316;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg-bg: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      direction: rtl;
    }

    /* هدر و ردیف ۴ تایی تبلیغات */
    header {
      background: var(--panel-dark);
      padding: 10px 14px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-home {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.2rem;
    }

    /* ۴ باکس مربعی شکیل و هم‌تراز */
    .promo-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      overflow: hidden;
    }

    .promo-box {
      flex: 1 1 0;
      min-width: 0;
      height: 64px;
      background: linear-gradient(145deg, #17233a, #0f172a);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.68rem;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .promo-box i {
      color: var(--accent-orange);
      font-size: 1.05rem;
    }

    .promo-box:hover {
      border-color: var(--accent-orange);
      background: #1e293b;
      transform: translateY(-1px);
    }

    /* محیط گفتگو */
    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      background: #131d31;
      border: 1px solid var(--panel-border);
      border-right: 3px solid var(--accent-orange);
      color: var(--text-main);
    }

    .user .bubble {
      background: var(--user-msg-bg);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }

    /* پیش‌نمایش فایل انتخابی */
    .file-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid var(--accent-orange);
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .file-preview button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* بخش ورود متن - کاملاً بهینه و پایدار */
    .input-bar {
      background: var(--panel-dark);
      padding: 10px 14px 14px;
      border-top: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .input-box {
      background: #07090e;
      border: 1.5px solid var(--panel-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 4px 8px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent-orange);
    }

    .attach-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 1.15rem;
      transition: color 0.2s;
    }

    .attach-btn:hover {
      color: var(--accent-orange);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 8px;
      resize: none;
      outline: none;
      font-size: 0.95rem;
      max-height: 120px;
      min-height: 24px;
    }

    .send-btn {
      background: var(--accent-orange);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      transition: opacity 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    /* سایدبار و لایه تاریک پشت آن */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 99;
      display: none;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -300px;
      width: 270px;
      height: 100%;
      background: var(--panel-dark);
      border-left: 1px solid var(--panel-border);
      z-index: 100;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--panel-border);
    }

    .sidebar-title {
      font-weight: bold;
      color: var(--accent-orange);
      font-size: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .new-chat-btn {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    #historyList {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #17233a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .history-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      color: #e2e8f0;
    }

    .delete-item-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }

    .delete-item-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title"><i class="fa-solid fa-clock-rotate-left"></i> تاریخچه گفتگوها</div>
      <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()"><i class="fa-solid fa-plus"></i> گفتگوی جدید</button>
    <div id="historyList"></div>
  </aside>

  <header>
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="brand"><i class="fa-solid fa-brain"></i> دستیار ژرف</div>
      <a href="index.html" class="back-home" title="بازگشت به خانه"><i class="fa-solid fa-house"></i></a>
    </div>
    
    <!-- ۴ جایگاه مربعی تبلیغات هماهنگ و یکدست -->
    <div class="promo-row">
      <a href="https://taaghche.com/book/296988" target="_blank" rel="noopener" class="promo-box">
        <i class="fa-solid fa-book-open"></i>
        <span>کتاب طاقچه</span>
      </a>
      <a href="https://mihanwebhost.com/my/referrers_confirm.php?code=mwh-8b7c8" target="_blank" rel="noopener nofollow" class="promo-box">
        <i class="fa-solid fa-server"></i>
        <span>هاست و سرور</span>
      </a>
      <a href="contact.html" class="promo-box">
        <i class="fa-solid fa-rectangle-ad"></i>
        <span>محل تبلیغ</span>
      </a>
      <a href="contact.html" class="promo-box">
        <i class="fa-solid fa-handshake"></i>
        <span>همکاری</span>
      </a>
    </div>
  </header>

  <main id="chatArea">
    <div class="message assistant">
      <div class="bubble">سلام</div>
    </div>
  </main>

  <footer class="input-bar">
    <div class="file-preview" id="filePreview">
      <span id="fileName"><i class="fa-solid fa-paperclip"></i> نام فایل</span>
      <button onclick="removeFile()"><i class="fa-solid fa-trash"></i></button>
    </div>
    <div class="input-box">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="پیوست فایل یا تصویر">
        <i class="fa-solid fa-paperclip"></i>
      </button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)">
      <textarea id="userInput" rows="1" placeholder="پیام خود را بنویسید..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()" title="ارسال پیام">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
