<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دستیار هوشمند ژرف AI | گفتگوی رایگان</title>
  <meta name="description" content="گفتگوی هوشمند، رایگان و بدون تحریم با ژرف AI. پاسخ به سوالات، تحلیل متون، ایده‌پردازی و برنامه‌نویسی.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://zherfai.ir/chat.html">
  
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#070d19">

  <style>
    :root {
      --bg: #070d19;
      --panel-bg: #0b1322;
      --card-bg: #0f1a2e;
      --border: #1a2c4e;
      --primary: #00ff88;
      --primary-dim: rgba(0, 255, 136, 0.15);
      --accent-cyan: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      direction: rtl;
    }

    /* سایدبار */
    #sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: fixed;
      right: -290px;
      top: 0;
      z-index: 1000;
      transition: right 0.3s ease;
    }

    #sidebar.active {
      right: 0;
    }

    #sidebarOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
      display: none;
    }

    #sidebarOverlay.active {
      display: block;
    }

    .sidebar-header {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .btn-new-chat {
      width: 100%;
      background: var(--primary-dim);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      padding: 9px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
    }

    .history-item:hover {
      border-color: var(--accent-cyan);
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .btn-clear-history {
      width: 100%;
      background: none;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* محیط اصلی چت */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    header {
      padding: 10px 14px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-status {
      font-size: 0.72rem;
      background: #0284c7;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .btn-menu {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    /* جایگاه‌های تبلیغاتی ۴گانه شکیل و فشرده */
    .promo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 8px 12px;
      background: #09101d;
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 650px) {
      .promo-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .promo-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 6px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: 0.2s;
    }

    .promo-card:hover {
      border-color: var(--primary);
    }

    .promo-title {
      font-size: 0.78rem;
      font-weight: bold;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .promo-card:nth-child(1) .promo-title { color: #38bdf8; }
    .promo-card:nth-child(2) .promo-title { color: #facc15; }
    .promo-card:nth-child(3) .promo-title { color: #a78bfa; }
    .promo-card:nth-child(4) .promo-title { color: #f472b6; }

    .promo-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* فضای پیام‌ها */
    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.7;
      word-break: break-word;
    }

    .msg-user {
      align-self: flex-start;
      background: #1e3a5f;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .msg-ai {
      align-self: flex-end;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
      position: relative;
    }

    .msg-ai .copy-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 0.7rem;
      padding: 2px 6px;
      cursor: pointer;
    }

    /* اینپوت بار */
    .input-wrapper {
      padding: 8px 12px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
    }

    .file-tag {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }

    .file-tag.active {
      display: inline-flex;
    }

    .file-remove {
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 8px;
    }

    .input-box:focus-within {
      border-color: var(--primary);
    }

    .btn-attach {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 4px;
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      padding: 8px 0;
      font-family: inherit;
    }

    .btn-send {
      background: var(--primary);
      border: none;
      color: #04100c;
      font-weight: bold;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- سایدبار -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight:bold; font-size:0.95rem;">تاریخچه گفتگوها</span>
      <button class="btn-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-body">
      <button class="btn-new-chat" onclick="startNewChat()">+ گفتگوی جدید</button>
      <ul class="history-list" id="historyList"></ul>
    </div>
    <div class="sidebar-footer">
      <button class="btn-clear-history" onclick="clearHistory()">پاک کردن تاریخچه</button>
    </div>
  </aside>

  <!-- بخش اصلی -->
  <div class="main-wrapper">
    <header>
      <div class="brand-title">
        <span>ژرف AI</span>
        <span class="badge-status">هوش مصنوعی آزاد</span>
      </div>
      <button class="btn-menu" onclick="toggleSidebar()">☰</button>
    </header>

    <!-- ۴ جایگاه تبلیغاتی شکیل -->
    <div class="promo-grid">
      <a href="https://taaghche.com/book/296988" target="_blank" rel="noopener" class="promo-card">
        <span class="promo-title">📚 کتاب اختصاصی AI</span>
        <span class="promo-desc">مطالعه در طاقچه</span>
      </a>
      <a href="https://mihanwebhost.com/my/referrers_confirm.php?code=mwh-8b7c8" target="_blank" rel="noopener nofollow" class="promo-card">
        <span class="promo-title">🚀 هاست و سرور ابری</span>
        <span class="promo-desc">تخفیف ویژه کاربران</span>
      </a>
      <a href="contact.html" class="promo-card">
        <span class="promo-title">📢 جایگاه تبلیغات شما</span>
        <span class="promo-desc">رزرو تبلیغات و بنر</span>
      </a>
      <a href="contact.html" class="promo-card">
        <span class="promo-title">💼 اسپانسری و همکاری</span>
        <span class="promo-desc">سفارش و ارتباط با ما</span>
      </a>
    </div>

    <!-- محیط نمایش پیام‌ها -->
    <div id="chatArea">
      <div class="msg msg-ai">
        <strong>ژِرف :</strong> سلام.
      </div>
    </div>

    <!-- اینپوت ارسال -->
    <div class="input-wrapper">
      <div class="file-tag" id="fileTag">
        <span id="fileName"></span>
        <span class="file-remove" onclick="removeAttachedFile()">✕</span>
      </div>
      <div class="input-box">
        <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="پیوست تصویر یا سند">+</button>
        <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.doc,.docx" onchange="handleFileSelect(event)">
        <input type="text" id="userInput" placeholder="پیام خود را بنویسید..." autocomplete="off">
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">ارسال</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
